<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep Cosmic Void Gradient -->
    <linearGradient id="spaceCosmos" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#020409" />
      <stop offset="40%" stop-color="#040815" />
      <stop offset="68%" stop-color="#071026" />
      <stop offset="85%" stop-color="#0a1738" />
      <stop offset="100%" stop-color="#030612" />
    </linearGradient>

    <!-- Planetary Earth Surface Gradient -->
    <radialGradient id="earthSurface" cx="50%" cy="175%" r="125%">
      <stop offset="0%" stop-color="#020510" />
      <stop offset="60%" stop-color="#03081c" />
      <stop offset="82%" stop-color="#061230" />
      <stop offset="96%" stop-color="#0c255c" />
      <stop offset="100%" stop-color="#184896" />
    </radialGradient>

    <!-- Broad Atmospheric Glow Aura -->
    <radialGradient id="atmosAura" cx="50%" cy="102%" r="68%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.42" />
      <stop offset="28%" stop-color="#0066ff" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#020409" stop-opacity="0" />
    </radialGradient>

    <!-- Horizon Atmospheric Crest Flare -->
    <radialGradient id="horizonFlare" cx="48%" cy="76%" r="42%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="14%" stop-color="#7dd3fc" stop-opacity="0.55" />
      <stop offset="38%" stop-color="#0284c7" stop-opacity="0.28" />
      <stop offset="75%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>

    <!-- Upper Darkness Scrim to ensure pristine search UI contrast -->
    <linearGradient id="uiScrim" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#020409" stop-opacity="0.88" />
      <stop offset="50%" stop-color="#020409" stop-opacity="0.6" />
      <stop offset="78%" stop-color="#020409" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#020409" stop-opacity="0" />
    </linearGradient>

    <!-- Optical Glow Filters -->
    <filter id="limbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softHalo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" />
    </filter>
  </defs>

  <!-- Deep Cosmos Canvas -->
  <rect width="1920" height="1080" fill="url(#spaceCosmos)" />

  <!-- Subtle Distant Stars in Upper Void -->
  <g fill="#ffffff">
    <circle cx="120" cy="85" r="1" opacity="0.45" />
    <circle cx="260" cy="160" r="1.3" opacity="0.6" />
    <circle cx="390" cy="70" r="0.8" opacity="0.35" />
    <circle cx="580" cy="130" r="1.5" opacity="0.7" />
    <circle cx="760" cy="65" r="1" opacity="0.45" />
    <circle cx="920" cy="110" r="1.2" opacity="0.6" />
    <circle cx="1080" cy="55" r="0.8" opacity="0.3" />
    <circle cx="1280" cy="140" r="1.4" opacity="0.65" />
    <circle cx="1450" cy="80" r="1" opacity="0.5" />
    <circle cx="1640" cy="155" r="1.2" opacity="0.6" />
    <circle cx="1790" cy="95" r="0.9" opacity="0.4" />
    <circle cx="210" cy="270" r="1" opacity="0.35" />
    <circle cx="490" cy="220" r="0.9" opacity="0.3" />
    <circle cx="820" cy="250" r="1.2" opacity="0.45" />
    <circle cx="1200" cy="210" r="1" opacity="0.4" />
    <circle cx="1540" cy="260" r="1.1" opacity="0.5" />
    <circle cx="1710" cy="205" r="0.8" opacity="0.3" />
    <circle cx="340" cy="350" r="1" opacity="0.25" />
    <circle cx="1020" cy="320" r="1.1" opacity="0.35" />
    <circle cx="1390" cy="340" r="0.9" opacity="0.3" />
  </g>

  <!-- Atmospheric Glow Halo Wash -->
  <ellipse cx="960" cy="980" rx="1180" ry="360" fill="url(#atmosAura)" filter="url(#softHalo)" />

  <!-- Luminous Electric Blue Horizon Edge Flare -->
  <path d="M-200 1150 Q960 720 2120 1150 L2120 1200 L-200 1200 Z" fill="url(#atmosAura)" filter="url(#limbGlow)" />

  <!-- Radiant Sunrise / Horizon Flare on the Crest -->
  <ellipse cx="920" cy="780" rx="520" ry="150" fill="url(#horizonFlare)" filter="url(#limbGlow)" />

  <!-- Earth Body (Planetary Curved Silhouette) -->
  <path d="M-200 1150 Q960 740 2120 1150 L2120 1080 L-200 1080 Z" fill="url(#earthSurface)" />

  <!-- Primary Atmospheric Edge / Neon Blue Limb -->
  <path d="M-200 1150 Q960 740 2120 1150" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.85" filter="url(#limbGlow)" />
  <path d="M-200 1150 Q960 740 2120 1150" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.75" />

  <!-- Secondary Deep Electric Blue Edge Layer -->
  <path d="M-200 1155 Q960 745 2120 1155" fill="none" stroke="#0066ff" stroke-width="6" stroke-opacity="0.45" filter="url(#limbGlow)" />

  <!-- Top Scrim to guarantee perfect text contrast in search area -->
  <rect width="1920" height="680" fill="url(#uiScrim)" />
</svg>
