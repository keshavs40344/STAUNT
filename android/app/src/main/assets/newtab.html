<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Favorites</title>
  <style>
    :root {
      --bg: #101012;
      --text-main: rgba(255, 255, 255, 0.92);
      --text-muted: rgba(255, 255, 255, 0.45);
      --system-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Roboto, Inter, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(ellipse at 50% 25%, #1b1b22 0%, #0d0d0f 100%);
      min-height: 100vh;
      font-family: var(--system-font);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 16px 40px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    /* Subtle Dynamic Time & Contextual Date */
    .greeting-container {
      text-align: center;
      margin-bottom: 28px;
    }

    .greeting-time {
      font-size: 46px;
      font-weight: 200;
      letter-spacing: -0.03em;
      color: rgba(255, 255, 255, 0.90);
      line-height: 1;
      margin-bottom: 8px;
    }

    .greeting-text {
      font-size: 13.5px;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: -0.01em;
    }

    /* Centered Search Box */
    .search-container {
      width: 100%;
      max-width: 520px;
      margin-bottom: 32px;
    }

    .search-box {
      width: 100%;
      height: 48px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-box:focus-within {
      background: rgba(255, 255, 255, 0.10);
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.28), 0 12px 32px rgba(0, 0, 0, 0.45);
      transform: translateY(-1px);
    }

    .search-icon {
      width: 18px;
      height: 18px;
      stroke: var(--text-muted);
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: var(--system-font);
      font-size: 14.5px;
      font-weight: 400;
    }

    .search-input::placeholder {
      color: var(--text-muted);
      opacity: 0.8;
    }

    /* Favorites Section */
    .favorites-section {
      width: 100%;
      max-width: 560px;
    }

    .favorites-header {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 16px;
      padding-left: 8px;
    }

    /* Responsive Grid */
    .favorites-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px 12px;
      justify-items: center;
    }

    @media (max-width: 480px) {
      .favorites-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px 8px;
      }
      .greeting-time {
        font-size: 40px;
      }
    }

    .favorite-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      position: relative;
      cursor: pointer;
      width: 76px;
      touch-action: manipulation;
    }

    /* Authentic 56x56 Squircle */
    .squircle {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease;
      position: relative;
    }

    .favorite-tile:active .squircle {
      transform: scale(0.94);
    }

    .tile-label {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-main);
      opacity: 0.85;
      margin-top: 8px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 76px;
    }

    .delete-btn {
      position: absolute;
      top: -4px;
      right: 4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(44, 44, 46, 0.95);
      border: 0.5px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      z-index: 10;
    }

    .delete-btn:active {
      background: #ff453a;
    }

    /* Add Shortcut Tile */
    .add-shortcut-tile {
      cursor: pointer;
    }
    .add-shortcut-tile:active .squircle {
      border-color: rgba(255,255,255,0.45) !important;
      background: rgba(255,255,255,0.12) !important;
    }

    /* Shortcut Modal */
    .shortcut-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 16px;
    }
    .shortcut-modal {
      background: #1c1c1e;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 24px;
      width: 320px;
      max-width: 90vw;
    }
    .shortcut-modal-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 16px;
    }
    .shortcut-modal input {
      width: 100%;
      padding: 11px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 14px;
      font-family: var(--system-font);
      outline: none;
      margin-bottom: 10px;
    }
    .shortcut-modal input:focus {
      border-color: #8b5cf6;
    }
    .shortcut-modal-error {
      color: #ff453a;
      font-size: 12px;
      min-height: 18px;
      margin-bottom: 8px;
    }
    .shortcut-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .shortcut-modal-actions button {
      padding: 9px 18px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: var(--text-main);
      font-size: 13.5px;
      cursor: pointer;
    }
    .shortcut-modal-actions button.primary {
      background: #8b5cf6;
      border-color: #8b5cf6;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Dynamic Greeting & Time -->
  <div class="greeting-container">
    <div class="greeting-time" id="greetingTime">09:41</div>
    <div class="greeting-text" id="greetingText">Good Morning</div>
  </div>

  <!-- Centered Search Box -->
  <div class="search-container">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input 
        type="text" 
        id="newtabSearchInput" 
        class="search-input" 
        placeholder="Search with Staunt or enter address" 
        autocomplete="off" 
        spellcheck="false" 
      />
    </div>
  </div>

  <!-- Favorites Section -->
  <section class="favorites-section">
    <div class="favorites-header">Favorites</div>
    
    <div class="favorites-grid" id="favoritesGrid">
      
      <!-- 1. YouTube -->
      <a href="https://www.youtube.com" class="favorite-tile" data-id="youtube">
        <button class="delete-btn" onclick="removeFav(event, 'youtube')">&times;</button>
        <div class="squircle" style="background: #ff0000;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#ffffff"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        </div>
        <span class="tile-label">YouTube</span>
      </a>

      <!-- 2. GitHub -->
      <a href="https://github.com" class="favorite-tile" data-id="github">
        <button class="delete-btn" onclick="removeFav(event, 'github')">&times;</button>
        <div class="squircle" style="background: #24292e; border: 0.5px solid rgba(255,255,255,0.15);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#ffffff"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        </div>
        <span class="tile-label">GitHub</span>
      </a>

      <!-- 3. Bing -->
      <a href="https://www.bing.com" class="favorite-tile" data-id="bing">
        <button class="delete-btn" onclick="removeFav(event, 'bing')">&times;</button>
        <div class="squircle" style="background: #008373;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="#ffffff"><path d="M5 3v18l5-3 6 3 3-5-6-3V7l-8-4z"/></svg>
        </div>
        <span class="tile-label">Bing</span>
      </a>

      <!-- 4. ChatGPT -->
      <a href="https://chatgpt.com" class="favorite-tile" data-id="chatgpt">
        <button class="delete-btn" onclick="removeFav(event, 'chatgpt')">&times;</button>
        <div class="squircle" style="background: #10a37f;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2zm0 4a6 6 0 1 0 0 12A6 6 0 0 0 12 6z"/></svg>
        </div>
        <span class="tile-label">ChatGPT</span>
      </a>

      <!-- 5. Wikipedia -->
      <a href="https://en.wikipedia.org" class="favorite-tile" data-id="wikipedia">
        <button class="delete-btn" onclick="removeFav(event, 'wikipedia')">&times;</button>
        <div class="squircle" style="background: #ffffff;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#000000"><path d="M12.09 13.124l2.678-6.044h1.724l-3.524 7.646 2.062 4.417c.307.653.64 1.05 1 .194l4.97-12.257h1.699L17.18 19.143c-.496 1.09-1.288 1.6-2.378 1.531-1.09-.07-1.802-.638-2.14-1.706l-1.99-4.708-2.02 4.708c-.337 1.068-1.05 1.636-2.139 1.706-1.09.07-1.882-.442-2.378-1.531L-.001 7.08h1.7l4.97 12.257c.36.856.693.459 1-.194l2.062-4.417-3.524-7.646h1.724l2.679 6.044 1.48-3.486 1.48 3.486z"/></svg>
        </div>
        <span class="tile-label">Wikipedia</span>
      </a>

      <!-- 6. X -->
      <a href="https://x.com" class="favorite-tile" data-id="x">
        <button class="delete-btn" onclick="removeFav(event, 'x')">&times;</button>
        <div class="squircle" style="background: #000000; border: 0.5px solid rgba(255,255,255,0.2);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#ffffff"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </div>
        <span class="tile-label">X</span>
      </a>

      <!-- Add Shortcut -->
      <div class="favorite-tile add-shortcut-tile" id="addShortcutTile">
        <div class="squircle" style="background: rgba(255,255,255,0.08); border: 1.5px dashed rgba(255,255,255,0.25);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </div>
        <span class="tile-label" style="color: var(--text-muted);">Add shortcut</span>
      </div>
    </div>
  </section>

  <!-- Add Shortcut Modal -->
  <div class="shortcut-modal-overlay" id="shortcutModal" style="display:none;">
    <div class="shortcut-modal">
      <div class="shortcut-modal-title">Add shortcut</div>
      <input type="text" id="shortcutName" placeholder="Name" autocomplete="off" />
      <input type="text" id="shortcutUrl" placeholder="URL (e.g. https://example.com)" autocomplete="off" />
      <div class="shortcut-modal-error" id="shortcutError"></div>
      <div class="shortcut-modal-actions">
        <button id="shortcutCancel">Cancel</button>
        <button id="shortcutSave" class="primary">Save</button>
      </div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('greetingTime').textContent = `${hours % 12 || 12}:${minutes}`;

      let greet = 'Good Evening';
      if (hours < 12) greet = 'Good Morning';
      else if (hours < 18) greet = 'Good Afternoon';
      
      const options = { weekday: 'long', month: 'short', day: 'numeric' };
      document.getElementById('greetingText').textContent = `${greet} • ${now.toLocaleDateString(undefined, options)}`;
    }

    updateClock();
    setInterval(updateClock, 10000);

    const FAVORITES_KEY = 'staunt_favorites';
    const FAV_COLORS = ['#e74c3c','#8e44ad','#2980b9','#27ae60','#f39c12','#d35400','#1abc9c','#c0392b','#6c5ce7','#00b894'];

    function getStoredFavorites() {
      try { return JSON.parse(localStorage.getItem(FAVORITES_KEY) || '[]'); } catch(e) { return []; }
    }

    function saveStoredFavorites(favs) {
      try { localStorage.setItem(FAVORITES_KEY, JSON.stringify(favs)); } catch(e) {}
    }

    function createFavTile(fav) {
      const a = document.createElement('a');
      a.href = fav.url;
      a.className = 'favorite-tile';
      a.setAttribute('data-id', fav.id);
      a.setAttribute('data-custom', 'true');
      const color = FAV_COLORS[Math.abs(fav.name.charCodeAt(0)) % FAV_COLORS.length];
      a.innerHTML = `
        <button class="delete-btn" onclick="removeFav(event, '${fav.id}')">&times;</button>
        <div class="squircle" style="background: ${color};">
          <span style="font-size:20px; font-weight:600; color:#fff;">${fav.name.charAt(0).toUpperCase()}</span>
        </div>
        <span class="tile-label">${fav.name}</span>
      `;
      a.addEventListener('click', (e) => {
        if (e.target.closest('.delete-btn')) return;
        e.preventDefault();
        window.location.href = fav.url;
      });
      return a;
    }

    function loadFavorites() {
      const grid = document.getElementById('favoritesGrid');
      const addTile = document.getElementById('addShortcutTile');
      // Remove previously rendered custom tiles
      grid.querySelectorAll('[data-custom="true"]').forEach(t => t.remove());
      const favs = getStoredFavorites();
      // Insert custom tiles before the first hard-coded tile
      const firstChild = grid.firstElementChild;
      favs.forEach(fav => {
        grid.insertBefore(createFavTile(fav), firstChild);
      });
      // Ensure add-shortcut tile is last
      if (addTile) grid.appendChild(addTile);
    }

    function removeFav(e, id) {
      e.preventDefault();
      e.stopPropagation();
      const tile = document.querySelector(`[data-id="${id}"]`);
      if (tile) {
        tile.style.opacity = '0';
        tile.style.transform = 'scale(0.8)';
        setTimeout(() => tile.remove(), 200);
      }
      // Also remove from localStorage
      const favs = getStoredFavorites().filter(f => f.id !== id);
      saveStoredFavorites(favs);
    }

    // Add shortcut modal logic
    const addShortcutTile = document.getElementById('addShortcutTile');
    const shortcutModal = document.getElementById('shortcutModal');
    const shortcutName = document.getElementById('shortcutName');
    const shortcutUrl = document.getElementById('shortcutUrl');
    const shortcutError = document.getElementById('shortcutError');
    const shortcutCancel = document.getElementById('shortcutCancel');
    const shortcutSave = document.getElementById('shortcutSave');

    if (addShortcutTile) {
      addShortcutTile.addEventListener('click', () => {
        shortcutName.value = '';
        shortcutUrl.value = '';
        shortcutError.textContent = '';
        shortcutModal.style.display = 'flex';
        shortcutName.focus();
      });
    }

    if (shortcutCancel) {
      shortcutCancel.addEventListener('click', () => {
        shortcutModal.style.display = 'none';
      });
    }

    if (shortcutModal) {
      shortcutModal.addEventListener('click', (e) => {
        if (e.target === shortcutModal) shortcutModal.style.display = 'none';
      });
    }

    if (shortcutSave) {
      shortcutSave.addEventListener('click', () => {
        const name = shortcutName.value.trim();
        let url = shortcutUrl.value.trim();
        if (!name) { shortcutError.textContent = 'Name is required.'; return; }
        if (!url) { shortcutError.textContent = 'URL is required.'; return; }
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        try { new URL(url); } catch(e) { shortcutError.textContent = 'Invalid URL.'; return; }
        const id = 'custom_' + Date.now();
        const favs = getStoredFavorites();
        favs.push({ id, name, url });
        saveStoredFavorites(favs);
        loadFavorites();
        shortcutModal.style.display = 'none';
      });
    }

    loadFavorites();

    // Direct navigation & STAUNT search routing for New Tab search box
    const searchInput = document.getElementById('newtabSearchInput');
    if (searchInput) {
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const val = searchInput.value.trim();
          if (val) {
            let target = val;
            if (!/^https?:\/\//i.test(val) && !val.startsWith('file://')) {
              const isLocalhost = /^localhost(:\d+)?(\/.*)?$/i.test(val);
              const isIpv4 = /^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(:\d+)?(\/.*)?$/.test(val);
              const isDomain = /^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(:\d+)?(\/.*)?$/i.test(val) && !val.includes(' ');

              if (isLocalhost || isIpv4) {
                target = 'http://' + val;
              } else if (isDomain) {
                target = 'https://' + val;
              } else {
                const searchBase = window.STAUNT_SEARCH_BASE || 'https://staunt.vercel.app/?q=';
                target = searchBase + encodeURIComponent(val);
              }
            }
            window.location.href = target;
          }
        }
      });
    }

    // Ensure all authentic favorite tiles navigate the tab directly
    document.querySelectorAll('.favorite-tile:not(.add-shortcut-tile)').forEach(tile => {
      tile.addEventListener('click', (e) => {
        if (e.target.closest('.delete-btn')) return;
        e.preventDefault();
        const href = tile.getAttribute('href');
        if (href) window.location.href = href;
      });
    });
  </script>
</body>
</html>
