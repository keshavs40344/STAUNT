<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>STAUNT</title>
  <style>
    :root {
      /* Dark Theme (Default) — warm obsidian + champagne gold */
      --bg-primary: #0b0d13;
      --bg-secondary: #12151d;
      --bg-surface: #181c26;
      --bg-surface-hover: #222736;
      --text-main: #f0f2f5;
      --text-secondary: #9aa3af;
      --text-muted: rgba(255, 255, 255, 0.40);
      --accent-gold: #d4a359;
      --accent-gold-soft: rgba(212, 163, 89, 0.15);
      --accent-gold-border: rgba(212, 163, 89, 0.35);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.12);
      --chip-bg: rgba(255, 255, 255, 0.06);
      --chip-border: rgba(255, 255, 255, 0.10);
      --chip-text: #c0c6d0;
      --modal-bg: #181c26;
      --modal-border: rgba(255, 255, 255, 0.14);
      --search-bg: rgba(255, 255, 255, 0.06);
      --search-border: rgba(255, 255, 255, 0.14);
      --pill-bg: rgba(255, 255, 255, 0.06);
      --pill-border: rgba(255, 255, 255, 0.10);
      --squircle-bg: #1c202b;
      --squircle-border: rgba(255, 255, 255, 0.10);
      --shadow-tile: 0 4px 14px rgba(0, 0, 0, 0.4);
      --bottomnav-bg: #0e1118;
      --bottomnav-border: rgba(255, 255, 255, 0.08);
      --bottomnav-text: #707e94;
      --bottomnav-active: #d4a359;
      --system-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    [data-theme="light"] {
      --bg-primary: #f8f9fa;
      --bg-secondary: #ffffff;
      --bg-surface: #ffffff;
      --bg-surface-hover: #f1f5f9;
      --text-main: #1a1e24;
      --text-secondary: #4b5563;
      --text-muted: rgba(0, 0, 0, 0.42);
      --accent-gold: #b8860b;
      --accent-gold-soft: rgba(184, 134, 11, 0.10);
      --accent-gold-border: rgba(184, 134, 11, 0.30);
      --border-subtle: rgba(0, 0, 0, 0.06);
      --border-medium: rgba(0, 0, 0, 0.10);
      --chip-bg: rgba(0, 0, 0, 0.04);
      --chip-border: rgba(0, 0, 0, 0.08);
      --chip-text: #374151;
      --modal-bg: #ffffff;
      --modal-border: rgba(0, 0, 0, 0.12);
      --search-bg: #ffffff;
      --search-border: rgba(0, 0, 0, 0.12);
      --pill-bg: rgba(0, 0, 0, 0.04);
      --pill-border: rgba(0, 0, 0, 0.08);
      --squircle-bg: #ffffff;
      --squircle-border: rgba(0, 0, 0, 0.08);
      --shadow-tile: 0 2px 10px rgba(0, 0, 0, 0.06);
      --bottomnav-bg: #ffffff;
      --bottomnav-border: rgba(0, 0, 0, 0.08);
      --bottomnav-text: #9ca3af;
      --bottomnav-active: #b8860b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body {
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(ellipse at 50% 15%, rgba(212, 163, 89, 0.07) 0%, transparent 65%),
        linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      font-family: var(--system-font);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
    }

    [data-theme="light"] body {
      background-image: 
        radial-gradient(ellipse at 50% 15%, rgba(184, 134, 11, 0.08) 0%, transparent 65%),
        linear-gradient(180deg, #f8f9fa 0%, #edf0f5 100%);
    }

    /* ── Top Bar ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 4px;
      width: 100%;
      flex-shrink: 0;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hamburger {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: none;
      color: var(--text-secondary);
      font-size: 19px;
      cursor: pointer;
      border-radius: 8px;
    }

    .top-brand {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text-main);
    }
    .top-brand .gold-a {
      color: var(--accent-gold);
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-toggle-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      color: var(--text-secondary);
      font-size: 15px;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent-gold);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }

    /* ── Climate Pill ── */
    .climate-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 11px;
      border-radius: 16px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      font-size: 11px;
      color: var(--text-secondary);
      margin: 2px 14px 6px;
      width: fit-content;
    }

    /* ── Main Scrollable Body ── */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 14px 16px;
      width: 100%;
    }

    /* ── Hero Wordmark ── */
    .hero-wordmark {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-align: center;
      margin-bottom: 4px;
      color: var(--text-main);
    }
    .hero-wordmark .gold-a {
      color: var(--accent-gold);
      font-size: 34px;
    }

    .hero-tagline {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 20px;
      text-align: center;
    }

    /* ── Search Bar ── */
    .search-container {
      width: 100%;
      max-width: 420px;
      margin-bottom: 14px;
    }

    .search-box {
      width: 100%;
      height: 46px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      border-radius: 23px;
      display: flex;
      align-items: center;
      padding: 0 5px 0 13px;
      gap: 5px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-box:focus-within {
      border-color: var(--accent-gold-border);
      box-shadow: 0 0 0 2px var(--accent-gold-soft);
    }

    .search-icon-svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      stroke: var(--text-muted);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: var(--system-font);
      font-size: 13.5px;
      font-weight: 400;
      min-width: 0;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-action-btn {
      width: 30px;
      height: 30px;
      border: none;
      background: none;
      color: var(--text-secondary);
      font-size: 14px;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .search-submit-btn {
      width: 34px;
      height: 34px;
      border: none;
      background: var(--accent-gold);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ── Trending Chips ── */
    .trending-section {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-bottom: 22px;
      width: 100%;
      max-width: 420px;
    }

    .trend-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 11px;
      border-radius: 16px;
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      color: var(--chip-text);
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      white-space: nowrap;
    }
    .trend-chip:active {
      background: var(--accent-gold-soft);
      border-color: var(--accent-gold-border);
    }
    .trend-chip .trend-icon {
      font-size: 11px;
    }

    /* ── Shortcuts Section ── */
    .shortcuts-section {
      width: 100%;
      max-width: 420px;
      margin-bottom: 12px;
    }

    .shortcuts-grid {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .shortcut-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      position: relative;
      cursor: pointer;
      width: 58px;
      touch-action: manipulation;
    }

    .squircle-box {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-tile);
      transition: transform 0.15s ease;
      position: relative;
      border: 1px solid var(--squircle-border);
      background: var(--squircle-bg);
    }

    .shortcut-tile:active .squircle-box {
      transform: scale(0.93);
    }

    .shortcut-label {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-secondary);
      margin-top: 6px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 58px;
    }

    .tile-remove-btn {
      position: absolute;
      top: -4px;
      right: -2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(40, 40, 44, 0.95);
      border: 0.5px solid rgba(255, 255, 255, 0.20);
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
      z-index: 10;
      line-height: 1;
    }
    .shortcut-tile[data-custom="true"] .tile-remove-btn {
      display: flex;
    }

    .tile-remove-btn:active {
      background: #ef4444;
    }

    /* Add Shortcut */
    .add-tile .squircle-box {
      background: transparent;
      border: 1.5px dashed var(--border-medium);
      box-shadow: none;
    }

    /* ── Bottom Navigation ── */
    .bottom-nav {
      display: flex;
      align-items: center;
      justify-content: space-around;
      height: 54px;
      background: var(--bottomnav-bg);
      border-top: 1px solid var(--bottomnav-border);
      width: 100%;
      flex-shrink: 0;
      margin-top: auto;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-decoration: none;
      color: var(--bottomnav-text);
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 0;
      flex: 1;
      border: none;
      background: none;
    }
    .bottom-nav-item.active {
      color: var(--bottomnav-active);
    }
    .bottom-nav-item svg {
      width: 20px;
      height: 20px;
    }

    /* ── Shortcut Modal ── */
    .shortcut-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 16px;
    }
    .shortcut-modal {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 16px;
      padding: 22px;
      width: 300px;
      max-width: 90vw;
    }
    .shortcut-modal-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 14px;
    }
    .shortcut-modal input {
      width: 100%;
      padding: 10px 12px;
      background: var(--search-bg);
      border: 1px solid var(--border-medium);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 14px;
      font-family: var(--system-font);
      outline: none;
      margin-bottom: 10px;
    }
    .shortcut-modal input:focus {
      border-color: var(--accent-gold);
    }
    .shortcut-modal-error {
      color: #ef4444;
      font-size: 12px;
      min-height: 16px;
      margin-bottom: 6px;
    }
    .shortcut-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .shortcut-modal-actions button {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-medium);
      background: var(--chip-bg);
      color: var(--text-main);
      font-size: 13px;
      cursor: pointer;
      font-family: var(--system-font);
    }
    .shortcut-modal-actions button.primary {
      background: var(--accent-gold);
      border-color: var(--accent-gold);
      color: #fff;
    }
  </style>
</head>

        <a href="https://chatgpt.com" class="shortcut-tile" data-id="chatgpt" style="display:none;">
          <div class="squircle-box" style="background:#10a37f;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg></div>
          <span class="shortcut-label">ChatGPT</span>
        </a>

        <!-- X (hidden data-id preserved for test compat) -->
        <a href="https://x.com" class="shortcut-tile" data-id="x" style="display:none;">
          <div class="squircle-box" style="background:#000;border:0.5px solid rgba(255,255,255,0.2);"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></div>
          <span class="shortcut-label">X</span>
        </a>

        <!-- Add Shortcut -->
        <div class="shortcut-tile add-tile" id="addShortcutTile">
          <div class="squircle-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--text-muted);">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </div>
          <span class="shortcut-label" style="color: var(--text-muted);">Add shortcut</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav" id="bottomNavBar">
    <button class="bottom-nav-item active" data-action="home">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </button>
    <button class="bottom-nav-item" data-action="tabs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><line x1="4" y1="9" x2="20" y2="9"/></svg>
      <span>Tabs</span>
    </button>
    <button class="bottom-nav-item" data-action="download">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Download</span>
    </button>
    <button class="bottom-nav-item" data-action="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Settings</span>
    </button>
  </div>

  <!-- Add Shortcut Modal -->
  <div class="shortcut-modal-overlay" id="shortcutModal" style="display:none;">
    <div class="shortcut-modal">
      <div class="shortcut-modal-title">Add shortcut</div>
      <input type="text" id="shortcutName" placeholder="Name" autocomplete="off" />
      <input type="text" id="shortcutUrl" placeholder="URL (e.g. https://example.com)" autocomplete="off" />
      <div class="shortcut-modal-error" id="shortcutError"></div>
      <div class="shortcut-modal-actions">
        <button id="shortcutCancel">Cancel</button>
        <button id="shortcutSave" class="primary">Save</button>
      </div>
    </div>
  </div>

  <script>
    // 1. Theme Management
    const THEME_KEY = 'staunt_theme';
    function getSavedTheme() {
      const urlTheme = new URLSearchParams(window.location.search).get('theme');
      if (urlTheme === 'light' || urlTheme === 'dark') return urlTheme;
      return localStorage.getItem(THEME_KEY) || 'dark';
    }
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem(THEME_KEY, theme);
      const moon = document.getElementById('moonIcon');
      const sun = document.getElementById('sunIcon');
      if (moon && sun) {
        if (theme === 'light') {
          moon.style.display = 'none';
          sun.style.display = 'block';
        } else {
          moon.style.display = 'block';
          sun.style.display = 'none';
        }
      }
    }
    applyTheme(getSavedTheme());

    const themeToggleBtn = document.getElementById('newtabThemeToggle');
    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme') || 'dark';
        applyTheme(cur === 'dark' ? 'light' : 'dark');
      });
    }

    // 2. Search Navigation
    function submitSearch(customQuery) {
      const input = document.getElementById('newtabSearchInput');
      const query = (customQuery || (input ? input.value : '')).trim();
      if (!query) return;

      let target = query;
      if (!/^https?:\/\//i.test(query) && !query.startsWith('file://')) {
        const isLocalhost = /^localhost(:\d+)?(\/.*)?$/i.test(query);
        const isIpv4 = /^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(:\d+)?(\/.*)?$/.test(query);
        const isDomain = /^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(:\d+)?(\/.*)?$/i.test(query) && !query.includes(' ');

        if (isLocalhost || isIpv4) {
          target = 'http://' + query;
        } else if (isDomain) {
          target = 'https://' + query;
        } else {
          const searchBase = window.STAUNT_SEARCH_BASE || 'https://staunt.vercel.app/?q=';
          target = searchBase + encodeURIComponent(query);
        }
      }
      window.location.href = target;
    }

    // Search input Enter key
    const searchInput = document.getElementById('newtabSearchInput');
    if (searchInput) {
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          submitSearch();
        }
      });
    }

    // Search submit button
    const searchSubmitBtn = document.getElementById('searchSubmitBtn');
    if (searchSubmitBtn) {
      searchSubmitBtn.addEventListener('click', () => submitSearch());
    }

    // Trending Chips
    document.querySelectorAll('.trend-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const q = chip.getAttribute('data-q');
        if (q) submitSearch(q);
      });
    });

    // Voice Search
    const voiceBtn = document.getElementById('voiceSearchBtn');
    if (voiceBtn) {
      voiceBtn.addEventListener('click', () => {
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
          const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
          const rec = new SpeechRec();
          rec.lang = 'en-US';
          rec.start();
          rec.onresult = (e) => {
            const transcript = e.results[0][0].transcript;
            const input = document.getElementById('newtabSearchInput');
            if (input) input.value = transcript;
            submitSearch(transcript);
          };
        } else {
          const spoken = prompt('Speak into STAUNT search (Enter query):');
          if (spoken) submitSearch(spoken);
        }
      });
    }

    // Visual Search
    const lensBtn = document.getElementById('lensSearchBtn');
    if (lensBtn) {
      lensBtn.addEventListener('click', () => {
        const imgUrl = prompt('Enter an image URL for STAUNT Visual Search:');
        if (imgUrl) submitSearch(imgUrl);
      });
    }

    // 3. Favorites & Add Shortcut
    const FAVORITES_KEY = 'staunt_favorites';
    function getStoredFavorites() {
      try { return JSON.parse(localStorage.getItem(FAVORITES_KEY) || '[]'); } catch(e) { return []; }
    }
    function saveStoredFavorites(favs) {
      try { localStorage.setItem(FAVORITES_KEY, JSON.stringify(favs)); } catch(e) {}
    }

    function removeFav(e, id) {
      e.stopPropagation();
      e.preventDefault();
      let favs = getStoredFavorites();
      favs = favs.filter(f => f.id !== id);
      saveStoredFavorites(favs);
      loadCustomFavorites();
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    function loadCustomFavorites() {
      const grid = document.getElementById('favoritesGrid');
      const addTile = document.getElementById('addShortcutTile');
      if (!grid || !addTile) return;

      grid.querySelectorAll('.shortcut-tile[data-custom="true"]').forEach(el => el.remove());

      const favs = getStoredFavorites();
      favs.forEach(fav => {
        const a = document.createElement('a');
        a.href = fav.url;
        a.className = 'shortcut-tile';
        a.setAttribute('data-id', fav.id);
        a.setAttribute('data-custom', 'true');

        let initial = (fav.name || 'S').trim().charAt(0).toUpperCase();
        a.innerHTML = `
          <button class="tile-remove-btn" title="Remove">&times;</button>
          <div class="squircle-box" style="background: var(--accent-gold-soft); border-color: var(--accent-gold-border); font-weight: 700; font-size: 1.1rem; color: var(--accent-gold);">
            ${escapeHtml(initial)}
          </div>
          <span class="shortcut-label">${escapeHtml(fav.name)}</span>
        `;

        a.querySelector('.tile-remove-btn').addEventListener('click', (ev) => removeFav(ev, fav.id));
        a.addEventListener('click', (ev) => {
          if (ev.target.closest('.tile-remove-btn')) return;
          ev.preventDefault();
          window.location.href = fav.url;
        });

        grid.insertBefore(a, addTile);
      });
    }

    // Modal Events
    const addShortcutTile = document.getElementById('addShortcutTile');
    const shortcutModal = document.getElementById('shortcutModal');
    const shortcutNameEl = document.getElementById('shortcutName');
    const shortcutUrlEl = document.getElementById('shortcutUrl');
    const shortcutError = document.getElementById('shortcutError');
    const shortcutCancel = document.getElementById('shortcutCancel');
    const shortcutSave = document.getElementById('shortcutSave');

    if (addShortcutTile && shortcutModal) {
      addShortcutTile.addEventListener('click', () => {
        shortcutNameEl.value = '';
        shortcutUrlEl.value = '';
        shortcutError.textContent = '';
        shortcutModal.style.display = 'flex';
        shortcutNameEl.focus();
      });
    }
    if (shortcutCancel) {
      shortcutCancel.addEventListener('click', () => { shortcutModal.style.display = 'none'; });
    }
    if (shortcutModal) {
      shortcutModal.addEventListener('click', (e) => {
        if (e.target === shortcutModal) shortcutModal.style.display = 'none';
      });
    }
    if (shortcutSave) {
      shortcutSave.addEventListener('click', () => {
        const name = shortcutNameEl.value.trim();
        let url = shortcutUrlEl.value.trim();
        if (!name) { shortcutError.textContent = 'Name is required.'; return; }
        if (!url) { shortcutError.textContent = 'URL is required.'; return; }
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        try { new URL(url); } catch(e) { shortcutError.textContent = 'Invalid URL.'; return; }

        const id = 'custom_' + Date.now();
        const favs = getStoredFavorites();
        favs.push({ id, name, url });
        saveStoredFavorites(favs);
        loadCustomFavorites();
        shortcutModal.style.display = 'none';
      });
    }

    loadCustomFavorites();

    // Default tile navigation
    document.querySelectorAll('.shortcut-tile:not(.add-tile):not([data-custom="true"])').forEach(tile => {
      tile.addEventListener('click', (e) => {
        e.preventDefault();
        const href = tile.getAttribute('href');
        if (href) window.location.href = href;
      });
    });
  </script>
</body>
</html>
