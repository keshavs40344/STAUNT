<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="kSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="35%" stop-color="#1e1b4b" />
      <stop offset="65%" stop-color="#4c1d95" />
      <stop offset="85%" stop-color="#701a75" />
      <stop offset="100%" stop-color="#a21caf" />
    </linearGradient>
    <linearGradient id="kMtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" />
      <stop offset="40%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="kWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#kSky)" />

  <!-- Mountain Silhouettes reflected in Kashmir Valley -->
  <polygon points="0,520 220,380 440,490 700,320 980,480 1260,340 1520,470 1740,360 1920,440 1920,700 0,700" fill="url(#kMtn)" opacity="0.85" />
  <polygon points="220,380 300,440 440,490 540,410 700,320 780,420 980,480 1080,400 1260,340 1380,420 1520,470 1620,400 1740,360 1840,420 1920,440 1920,700 0,700 0,520" fill="#f5f3ff" opacity="0.3" />

  <!-- Chinar Tree Silhouettes along the bank -->
  <g fill="#0b0f19">
    <path d="M120,680 Q100,560 140,480 Q170,440 220,460 Q260,500 240,580 Q220,650 180,680 Z" />
    <path d="M280,690 Q260,580 300,510 Q330,470 370,490 Q400,530 380,600 Q360,660 330,690 Z" />
    <path d="M1650,680 Q1620,550 1670,470 Q1710,430 1760,450 Q1800,490 1780,570 Q1750,640 1700,680 Z" />
  </g>

  <!-- Serene Dal Lake Surface with Reflections -->
  <rect y="680" width="1920" height="400" fill="url(#kWater)" />
  <ellipse cx="700" cy="760" rx="280" ry="15" fill="#a21caf" opacity="0.3" filter="blur(6px)" />
  <ellipse cx="1260" cy="780" rx="240" ry="12" fill="#818cf8" opacity="0.25" filter="blur(5px)" />

  <!-- Traditional Kashmiri Shikara Boat Silhouette with Canopy -->
  <g fill="#050811" transform="translate(860, 750)">
    <!-- Long slender hull with pointed prow -->
    <path d="M-140,20 Q0,45 180,10 Q140,35 -60,38 Q-120,32 -140,20 Z" />
    <!-- Canopy (Khano) -->
    <rect x="-40" y="-15" width="90" height="28" rx="4" />
    <!-- Pillars -->
    <line x1="-30" y1="15" x2="-30" y2="-15" stroke="#050811" stroke-width="3" />
    <line x1="40" y1="15" x2="40" y2="-15" stroke="#050811" stroke-width="3" />
    <!-- Boatman with heart-shaped paddle -->
    <circle cx="140" cy="5" r="9" />
    <path d="M135,15 L145,15 L140,30 Z" />
    <line x1="130" y1="18" x2="165" y2="40" stroke="#050811" stroke-width="3" />
  </g>

  <!-- Water ripples and Lotus Pads in Foreground -->
  <ellipse cx="400" cy="880" rx="35" ry="10" fill="#064e3b" opacity="0.7" />
  <ellipse cx="460" cy="910" rx="45" ry="12" fill="#047857" opacity="0.6" />
  <ellipse cx="1500" cy="900" rx="50" ry="14" fill="#064e3b" opacity="0.7" />
  <ellipse cx="1580" cy="940" rx="40" ry="11" fill="#047857" opacity="0.6" />

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="#04060f" opacity="0.5" />
</svg>
