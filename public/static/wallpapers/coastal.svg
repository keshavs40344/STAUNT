<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="cSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c192c" />
      <stop offset="40%" stop-color="#164e63" />
      <stop offset="70%" stop-color="#0891b2" />
      <stop offset="90%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="cSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e7490" />
      <stop offset="30%" stop-color="#155e75" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#cSky)" />
  <circle cx="960" cy="580" r="50" fill="#fffbeb" opacity="0.95" />
  <ellipse cx="960" cy="580" r="140" fill="#f97316" opacity="0.4" />

  <!-- Sea horizon -->
  <rect y="640" width="1920" height="440" fill="url(#cSea)" />
  <polygon points="0,640 1920,640 1920,655 0,650" fill="#0891b2" opacity="0.5" />
  <ellipse cx="960" cy="720" rx="300" ry="12" fill="#fbbf24" opacity="0.3" />
  <ellipse cx="960" cy="800" rx="420" ry="20" fill="#f97316" opacity="0.2" />

  <!-- Coastline curve / beach -->
  <path d="M0,860 Q400,820 800,900 T1920,920 L1920,1080 L0,1080 Z" fill="#0a101d" />

  <!-- Palm Tree Silhouettes on Left & Right -->
  <g fill="#040711">
    <!-- Left Palm 1 -->
    <path d="M120,950 Q160,780 180,620 Q186,780 140,950 Z" />
    <path d="M180,620 Q120,580 40,600 Q110,610 180,620 Z" />
    <path d="M180,620 Q140,540 80,520 Q140,560 180,620 Z" />
    <path d="M180,620 Q200,520 240,500 Q210,550 180,620 Z" />
    <path d="M180,620 Q250,560 310,570 Q240,590 180,620 Z" />

    <!-- Left Palm 2 -->
    <path d="M240,980 Q290,820 310,680 Q315,820 260,980 Z" />
    <path d="M310,680 Q250,640 170,660 Q240,670 310,680 Z" />
    <path d="M310,680 Q350,600 420,620 Q360,640 310,680 Z" />

    <!-- Right Palm -->
    <path d="M1780,960 Q1730,810 1710,640 Q1705,810 1760,960 Z" />
    <path d="M1710,640 Q1640,580 1570,600 Q1650,620 1710,640 Z" />
    <path d="M1710,640 Q1770,570 1840,580 Q1770,610 1710,640 Z" />
  </g>

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="#060c18" opacity="0.48" />
</svg>
