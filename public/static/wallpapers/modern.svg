<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="mSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="40%" stop-color="#0b132b" />
      <stop offset="75%" stop-color="#1c1954" />
      <stop offset="95%" stop-color="#311042" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="bldgFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bldgMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="waterReflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#mSky)" />

  <!-- Distant Tech City Towers -->
  <g fill="url(#bldgFar)" opacity="0.8">
    <rect x="80" y="440" width="70" height="400" />
    <polygon points="80,440 115,380 150,440" />
    <rect x="180" y="480" width="90" height="360" />
    <rect x="300" y="420" width="110" height="420" />
    <polygon points="300,420 355,350 410,420" />
    <rect x="440" y="460" width="80" height="380" />
    <rect x="560" y="380" width="130" height="460" />
    <polygon points="560,380 625,310 690,380" />
    <rect x="730" y="450" width="100" height="390" />
    <rect x="860" y="390" width="120" height="450" />
    <polygon points="860,390 920,330 980,390" />
    <rect x="1020" y="470" width="85" height="370" />
    <rect x="1140" y="410" width="110" height="430" />
    <rect x="1280" y="360" width="140" height="480" />
    <polygon points="1280,360 1350,290 1420,360" />
    <rect x="1460" y="430" width="90" height="410" />
    <rect x="1580" y="400" width="120" height="440" />
    <rect x="1730" y="460" width="80" height="380" />
  </g>

  <!-- Midground Modern Architecture Towers -->
  <g fill="url(#bldgMid)">
    <rect x="130" y="520" width="95" height="380" />
    <rect x="250" y="460" width="120" height="440" />
    <rect x="400" y="500" width="90" height="400" />
    <rect x="520" y="420" width="150" height="480" />
    <rect x="700" y="480" width="110" height="420" />
    <rect x="840" y="450" width="130" height="450" />
    <rect x="1000" y="510" width="100" height="390" />
    <rect x="1130" y="440" width="140" height="460" />
    <rect x="1310" y="420" width="130" height="480" />
    <rect x="1480" y="480" width="110" height="420" />
    <rect x="1620" y="450" width="130" height="450" />
  </g>

  <!-- Glowing Windows Pattern -->
  <g fill="#38bdf8" opacity="0.6">
    <rect x="540" y="460" width="8" height="12" /><rect x="560" y="460" width="8" height="12" /><rect x="580" y="460" width="8" height="12" />
    <rect x="540" y="490" width="8" height="12" /><rect x="580" y="490" width="8" height="12" /><rect x="620" y="490" width="8" height="12" />
    <rect x="540" y="520" width="8" height="12" /><rect x="560" y="520" width="8" height="12" /><rect x="600" y="520" width="8" height="12" />
    <rect x="860" y="480" width="10" height="14" /><rect x="885" y="480" width="10" height="14" /><rect x="910" y="480" width="10" height="14" />
    <rect x="860" y="510" width="10" height="14" /><rect x="910" y="510" width="10" height="14" />
    <rect x="1150" y="470" width="8" height="12" /><rect x="1170" y="470" width="8" height="12" /><rect x="1210" y="470" width="8" height="12" />
    <rect x="1330" y="450" width="10" height="14" /><rect x="1355" y="450" width="10" height="14" /><rect x="1380" y="450" width="10" height="14" />
    <rect x="1330" y="480" width="10" height="14" /><rect x="1380" y="480" width="10" height="14" />
  </g>
  <g fill="#f59e0b" opacity="0.5">
    <rect x="270" y="500" width="8" height="12" /><rect x="290" y="500" width="8" height="12" />
    <rect x="720" y="520" width="8" height="12" /><rect x="745" y="520" width="8" height="12" />
    <rect x="1500" y="520" width="8" height="12" /><rect x="1530" y="520" width="8" height="12" />
  </g>

  <!-- Modern Waterfront / Bay Reflection -->
  <rect y="780" width="1920" height="300" fill="url(#waterReflect)" />
  <ellipse cx="600" cy="850" rx="140" ry="12" fill="#38bdf8" opacity="0.25" />
  <ellipse cx="900" cy="860" rx="120" ry="10" fill="#6366f1" opacity="0.2" />
  <ellipse cx="1360" cy="850" rx="160" ry="14" fill="#a855f7" opacity="0.25" />

  <!-- Foreground Promenade / Bridge -->
  <polygon points="0,880 1920,880 1920,1080 0,1080" fill="#030712" />

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="#040711" opacity="0.5" />
</svg>
