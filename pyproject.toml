[project]
name = "staunt-search"
version = "5.4.0"
description = "STAUNT Sovereign Search & Discovery Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "groq>=0.9.0",
    "gunicorn>=21.2.0",
    "waitress>=3.0.0",
    "urllib3>=2.0.0",
    "lxml>=4.9.0",
]

[tool.uv]
package = false

[tool.setuptools.packages.find]
where = ["."]
include = ["api*"]
exclude = ["android*", "windows*", "releases*", "docs*", "backups*", "tests*", "search-engine*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
