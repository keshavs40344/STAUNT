<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Load Error • Staunt Browser</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #0f172a;
      --border: rgba(255, 255, 255, 0.1);
      --gold: #d4a359;
      --gold-hover: #e0b572;
      --text: #f8fafc;
      --muted: #94a3b8;
      --dim: #64748b;
      --danger: #f43f5e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .error-card {
      width: 100%;
      max-width: 500px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: rgba(212, 163, 89, 0.12);
      border: 1px solid rgba(212, 163, 89, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      margin-bottom: 18px;
    }
    .icon-wrap.security {
      background: rgba(244, 63, 94, 0.12);
      border-color: rgba(244, 63, 94, 0.3);
      color: var(--danger);
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
      color: var(--text);
    }
    .desc {
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .url-box {
      font-family: 'Cascadia Code', Consolas, monospace;
      font-size: 11.5px;
      color: #cbd5e1;
      background: rgba(8, 13, 26, 0.8);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 12px;
      margin-bottom: 12px;
      word-break: break-all;
      display: none;
    }
    .err-code {
      font-family: 'Cascadia Code', Consolas, monospace;
      font-size: 11px;
      color: var(--dim);
      margin-bottom: 22px;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      border-radius: 8px;
      padding: 9px 16px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    button:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }
    .btn-primary {
      background: var(--gold);
      color: #0b0f19;
      border: none;
    }
    .btn-primary:hover { background: var(--gold-hover); }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.11);
    }
  </style>
</head>
<body>
  <main class="error-card" role="alert">
    <div class="icon-wrap" id="iconWrap">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>
    <h1 id="errTitle">This site can't be reached</h1>
    <p class="desc" id="errDesc">The webpage could not be loaded. Check your network connection and verify the address.</p>
    <div class="url-box" id="errUrlBox"></div>
    <div class="err-code" id="errCodeBox"></div>
    <div class="actions">
      <button class="btn-primary" id="btnRetry">Retry</button>
      <button class="btn-secondary" id="btnBack">Go Back</button>
      <button class="btn-secondary" id="btnSearch">Search on STAUNT</button>
    </div>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const targetUrl = params.get('url') || '';
      const code = params.get('code') || '';
      const desc = params.get('desc') || 'ERR_CONNECTION_FAILED';
      const kind = params.get('kind') || 'network';
      const query = params.get('q') || '';
      const searchBase = params.get('searchBase') || 'https://staunt.vercel.app';

      const iconWrap = document.getElementById('iconWrap');
      const errTitle = document.getElementById('errTitle');
      const errDesc = document.getElementById('errDesc');
      const errUrlBox = document.getElementById('errUrlBox');
      const errCodeBox = document.getElementById('errCodeBox');
      const btnRetry = document.getElementById('btnRetry');
      const btnBack = document.getElementById('btnBack');
      const btnSearch = document.getElementById('btnSearch');

      if (kind === 'shield') {
        iconWrap.classList.add('security');
        errTitle.textContent = 'Blocked by STAUNT Shield';
        errDesc.textContent = 'This address matched STAUNT anti-phishing or deceptive domain rules and was blocked before loading.';
      } else if (kind === 'cert') {
        iconWrap.classList.add('security');
        errTitle.textContent = 'Your connection is not private';
        errDesc.textContent = 'The security certificate for this site could not be verified. Connection was halted to protect your privacy.';
      } else if (kind === 'search') {
        errTitle.textContent = 'Search service unavailable';
        errDesc.textContent = query
          ? 'Unable to reach STAUNT Search for "' + query + '". Check your internet connection and retry.'
          : 'Unable to reach STAUNT Search. Check your internet connection and retry.';
        btnSearch.style.display = 'none';
      }

      if (targetUrl) {
        errUrlBox.textContent = targetUrl;
        errUrlBox.style.display = 'block';
      }

      errCodeBox.textContent = desc + (code ? ' (' + code + ')' : '');

      function isSafeWebUrl(u) {
        try {
          const parsed = new URL(u);
          return parsed.protocol === 'http:' || parsed.protocol === 'https:';
        } catch (_) {
          return false;
        }
      }

      btnRetry.addEventListener('click', () => {
        if (isSafeWebUrl(targetUrl)) {
          window.location.replace(targetUrl);
        }
      });

      btnBack.addEventListener('click', () => {
        if (window.history.length > 1) {
          window.history.back();
        }
      });

      btnSearch.addEventListener('click', () => {
        if (isSafeWebUrl(searchBase)) {
          const cleanQ = query || targetUrl;
          window.location.href = searchBase.replace(/\/+$/, '') + '/?q=' + encodeURIComponent(cleanQ);
        }
      });
    })();
  </script>
</body>
</html>
